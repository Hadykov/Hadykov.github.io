<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Калькулятор расчёта</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card-bg: #ffffff;
            --primary: #007aff;
            --primary-active: #005fcc;
            --text: #1c1c1e;
            --text-secondary: #6e6e73;
            --border: #d1d1d6;
            --input-bg: #ffffff;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-btn: 0 4px 12px rgba(0, 122, 255, 0.25);
            --result-bg: #f2f2f7;
            --static-bg: #f2f2f7;
            --radius: 16px;
            --font-large: 1.2rem;
            --font-medium: 1rem;
            --font-small: 0.9rem;
            --transition-speed: 0.3s;
            --select-chevron: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%236e6e73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
            --heading-color: #000;
        }

        /* Тёмная тема */
        :root.dark,
        @media (prefers-color-scheme: dark) {
            :root:not(.light) {
                --bg: #000000;
                --card-bg: #1c1c1e;
                --primary: #0a84ff;
                --primary-active: #0066d6;
                --text: #ffffff;
                --text-secondary: #98989d;
                --border: #3a3a3c;
                --input-bg: #2c2c2e;
                --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
                --shadow-btn: 0 4px 12px rgba(10, 132, 255, 0.35);
                --result-bg: #2c2c2e;
                --static-bg: #2c2c2e;
                --select-chevron: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%2398989d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
                --heading-color: #ffffff;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            transition: background var(--transition-speed) ease, color var(--transition-speed) ease;
        }

        .calculator {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 28px;
            padding: 24px 20px 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: background var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
            position: relative;
        }

        /* Шапка с заголовком и переключателем темы */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 620;
            letter-spacing: -0.3px;
            color: var(--heading-color);
            transition: color var(--transition-speed) ease;
            margin: 0;
            flex: 1;
        }

        /* Кнопка переключения темы */
        .theme-toggle {
            background: var(--input-bg);
            border: 1.5px solid var(--border);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.3rem;
            transition: all var(--transition-speed) ease;
            flex-shrink: 0;
            color: var(--text);
            line-height: 1;
            padding: 0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            -webkit-user-select: none;
            user-select: none;
        }
        .theme-toggle:active {
            transform: scale(0.93);
            background: var(--border);
        }
        .theme-toggle .icon-sun,
        .theme-toggle .icon-moon {
            transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease;
            position: absolute;
        }
        .theme-toggle .icon-sun {
            opacity: 0;
            transform: scale(0.6);
        }
        .theme-toggle .icon-moon {
            opacity: 1;
            transform: scale(1);
        }
        /* В тёмной теме показываем солнце */
        :root.dark .theme-toggle .icon-sun,
        @media (prefers-color-scheme: dark) {
            :root:not(.light) .theme-toggle .icon-sun {
                opacity: 1;
                transform: scale(1);
            }
            :root:not(.light) .theme-toggle .icon-moon {
                opacity: 0;
                transform: scale(0.6);
            }
        }
        /* В светлой теме показываем луну (уже по умолчанию) */
        :root.light .theme-toggle .icon-sun {
            opacity: 0;
            transform: scale(0.6);
        }
        :root.light .theme-toggle .icon-moon {
            opacity: 1;
            transform: scale(1);
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: var(--font-small);
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: -0.2px;
            padding-left: 4px;
            transition: color var(--transition-speed) ease;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select,
        input {
            font-size: var(--font-large);
            padding: 14px 16px;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
            font-family: inherit;
            transition: all var(--transition-speed) ease;
            outline: none;
            letter-spacing: -0.2px;
        }

        select {
            background-image: var(--select-chevron);
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 18px;
            padding-right: 40px;
            cursor: pointer;
        }

        input {
            appearance: textfield;
            -webkit-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            opacity: 1;
            height: 32px;
        }

        select:focus,
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
        }
        :root.dark select:focus,
        :root.dark input:focus,
        @media (prefers-color-scheme: dark) {
            :root:not(.light) select:focus,
            :root:not(.light) input:focus {
                box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.25);
            }
        }

        .custom-input {
            display: none;
            flex: 1;
        }

        .custom-input.active {
            display: block;
        }

        .static-value {
            font-size: var(--font-large);
            font-weight: 500;
            background: var(--static-bg);
            padding: 14px 16px;
            border-radius: 12px;
            color: var(--text);
            width: 100%;
            display: flex;
            align-items: center;
            transition: background var(--transition-speed) ease, color var(--transition-speed) ease;
        }

        .btn-calculate {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 18px 20px;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            width: 100%;
            letter-spacing: -0.2px;
            box-shadow: var(--shadow-btn);
            margin-top: 4px;
        }

        .btn-calculate:active {
            background: var(--primary-active);
            transform: scale(0.98);
        }

        .result-card {
            background: var(--result-bg);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-top: 2px;
            transition: background var(--transition-speed) ease;
        }

        .result-label {
            font-size: var(--font-small);
            color: var(--text-secondary);
            margin-bottom: 4px;
            transition: color var(--transition-speed) ease;
        }

        .result-value {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text);
            word-break: break-word;
            transition: color var(--transition-speed) ease;
        }

        .error-message {
            color: #ff3b30;
            font-size: 0.85rem;
            margin-top: 2px;
            padding-left: 4px;
            display: none;
        }
        :root.dark .error-message,
        @media (prefers-color-scheme: dark) {
            :root:not(.light) .error-message {
                color: #ff453a;
            }
        }

        .error-message.show {
            display: block;
        }

        /* Адаптивность */
        @media (max-width: 420px) {
            .calculator {
                padding: 20px 16px 20px;
                gap: 16px;
                border-radius: 24px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .theme-toggle {
                width: 38px;
                height: 38px;
                font-size: 1.2rem;
            }
            select,
            input,
            .static-value {
                font-size: 1rem;
                padding: 12px 14px;
            }
            select {
                padding-right: 36px;
                background-position: right 10px center;
                background-size: 16px;
            }
            .btn-calculate {
                padding: 16px;
                font-size: 1.15rem;
                border-radius: 12px;
            }
            .result-value {
                font-size: 2.2rem;
            }
            .result-card {
                padding: 16px;
                border-radius: 14px;
            }
        }

        @media (max-width: 340px) {
            body {
                padding: 12px 8px;
            }
            .calculator {
                padding: 16px 12px 16px;
                gap: 12px;
                border-radius: 20px;
            }
            h1 {
                font-size: 1.3rem;
            }
            .theme-toggle {
                width: 34px;
                height: 34px;
                font-size: 1rem;
            }
            select,
            input,
            .static-value {
                font-size: 0.9rem;
                padding: 10px 12px;
            }
            select {
                padding-right: 30px;
                background-position: right 8px center;
                background-size: 14px;
            }
            .btn-calculate {
                padding: 14px;
                font-size: 1rem;
                border-radius: 10px;
            }
            .result-value {
                font-size: 1.8rem;
            }
            label {
                font-size: 0.8rem;
            }
        }

        @media (min-width: 768px) {
            .calculator {
                padding: 32px 28px 28px;
                gap: 24px;
                border-radius: 32px;
                max-width: 460px;
            }
            h1 {
                font-size: 2rem;
            }
            .theme-toggle {
                width: 46px;
                height: 46px;
                font-size: 1.4rem;
            }
            select,
            input,
            .static-value {
                font-size: 1.25rem;
                padding: 16px 18px;
            }
            select {
                padding-right: 44px;
            }
            .btn-calculate {
                padding: 20px;
                font-size: 1.35rem;
                border-radius: 16px;
            }
            .result-value {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="header">
            <h1>📋 Калькулятор</h1>
            <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
                <span class="icon-sun">☀️</span>
                <span class="icon-moon">🌙</span>
            </button>
        </div>

        <!-- Базовая ставка -->
        <div class="field-group">
            <label for="baseRateSelect">Базовая ставка</label>
            <div class="input-row">
                <select id="baseRateSelect">
                    <option value="5500" selected>5500</option>
                    <option value="6050">6050</option>
                    <option value="8665">8665</option>
                    <option value="custom">Другое…</option>
                </select>
                <input type="number" id="baseRateCustom" class="custom-input" placeholder="Введите" step="any" min="0">
            </div>
        </div>

        <!-- Коэффициент территории -->
        <div class="field-group">
            <label for="territoryCoefSelect">Коэффициент территории</label>
            <div class="input-row">
                <select id="territoryCoefSelect">
                    <option value="1.7" selected>1.7</option>
                    <option value="1">1</option>
                    <option value="0.9">0.9</option>
                    <option value="custom">Другое…</option>
                </select>
                <input type="number" id="territoryCoefCustom" class="custom-input" placeholder="Введите" step="any" min="0">
            </div>
        </div>

        <!-- Коэффициент мощности -->
        <div class="field-group">
            <label for="powerCoefSelect">Коэффициент мощности</label>
            <div class="input-row">
                <select id="powerCoefSelect">
                    <option value="1.1">1.1</option>
                    <option value="1.2">1.2</option>
                    <option value="1.4">1.4</option>
                    <option value="1.6" selected>1.6</option>
                    <option value="custom">Другое…</option>
                </select>
                <input type="number" id="powerCoefCustom" class="custom-input" placeholder="Введите" step="any" min="0">
            </div>
        </div>

        <!-- Коэффициент возраст/стаж -->
        <div class="field-group">
            <label for="ageExperienceCoef">Коэффициент возраст / стаж</label>
            <input type="number" id="ageExperienceCoef" value="1" step="any" min="0" placeholder="1">
        </div>

        <!-- Коэффициент бонус-малус -->
        <div class="field-group">
            <label for="bonusMalusSelect">Коэффициент бонус-малус (КБМ)</label>
            <div class="input-row">
                <select id="bonusMalusSelect">
                    <option value="0.46">0.46</option>
                    <option value="0.52">0.52</option>
                    <option value="0.57">0.57</option>
                    <option value="0.63">0.63</option>
                    <option value="0.68">0.68</option>
                    <option value="0.74">0.74</option>
                    <option value="0.78">0.78</option>
                    <option value="0.83">0.83</option>
                    <option value="0.91">0.91</option>
                    <option value="1" selected>1</option>
                    <option value="1.17">1.17</option>
                    <option value="1.76">1.76</option>
                    <option value="2.25">2.25</option>
                    <option value="2.94">2.94</option>
                    <option value="3.92">3.92</option>
                    <option value="custom">Другое…</option>
                </select>
                <input type="number" id="bonusMalusCustom" class="custom-input" placeholder="Введите" step="any" min="0">
            </div>
        </div>

        <button class="btn-calculate" id="calculateBtn">Рассчитать</button>

        <div id="errorMessage" class="error-message"></div>

        <div class="result-card" id="resultCard" style="display: none;">
            <div class="result-label">Итоговая стоимость</div>
            <div class="result-value" id="resultValue">0</div>
        </div>
    </div>

    <script>
        (function() {
            // --- Работа с темой ---
            const html = document.documentElement;
            const themeToggle = document.getElementById('theme-toggle') || document.getElementById('themeToggle');

            // Применение темы
            function applyTheme(theme) {
                if (theme === 'dark') {
                    html.classList.add('dark');
                    html.classList.remove('light');
                } else if (theme === 'light') {
                    html.classList.add('light');
                    html.classList.remove('dark');
                } else {
                    // Авто: удаляем оба класса, полагаемся на системные настройки через media query
                    html.classList.remove('dark', 'light');
                }
            }

            // Получение сохранённой темы
            function getSavedTheme() {
                return localStorage.getItem('calculator-theme') || 'auto';
            }

            // Сохранение темы
            function saveTheme(theme) {
                localStorage.setItem('calculator-theme', theme);
            }

            // Инициализация темы при загрузке
            const savedTheme = getSavedTheme();
            applyTheme(savedTheme);

            // Обработчик кнопки переключения темы
            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    const currentTheme = getSavedTheme();
                    let newTheme;
                    if (currentTheme === 'dark') {
                        newTheme = 'light';
                    } else if (currentTheme === 'light') {
                        newTheme = 'auto';
                    } else {
                        // Если сейчас авто, определяем, какая тема активна визуально
                        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                        newTheme = isDark ? 'light' : 'dark';
                    }
                    saveTheme(newTheme);
                    applyTheme(newTheme);
                });
            }

            // Отслеживание системных изменений темы, когда выбрано "auto"
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (getSavedTheme() === 'auto') {
                    // Просто позволяем CSS media query сработать — классы не трогаем
                    // Ничего не делаем, стили обновятся автоматически
                }
            });

            // --- Логика калькулятора ---
            const baseRateSelect = document.getElementById('baseRateSelect');
            const baseRateCustom = document.getElementById('baseRateCustom');
            const territoryCoefSelect = document.getElementById('territoryCoefSelect');
            const territoryCoefCustom = document.getElementById('territoryCoefCustom');
            const powerCoefSelect = document.getElementById('powerCoefSelect');
            const powerCoefCustom = document.getElementById('powerCoefCustom');
            const ageExperienceCoef = document.getElementById('ageExperienceCoef');
            const bonusMalusSelect = document.getElementById('bonusMalusSelect');
            const bonusMalusCustom = document.getElementById('bonusMalusCustom');
            const calculateBtn = document.getElementById('calculateBtn');
            const errorMessage = document.getElementById('errorMessage');
            const resultCard = document.getElementById('resultCard');
            const resultValue = document.getElementById('resultValue');

            function toggleCustomInput(selectElement, customInput) {
                if (selectElement.value === 'custom') {
                    customInput.classList.add('active');
                    customInput.focus();
                } else {
                    customInput.classList.remove('active');
                    customInput.value = '';
                }
            }

            baseRateSelect.addEventListener('change', () => toggleCustomInput(baseRateSelect, baseRateCustom));
            territoryCoefSelect.addEventListener('change', () => toggleCustomInput(territoryCoefSelect, territoryCoefCustom));
            powerCoefSelect.addEventListener('change', () => toggleCustomInput(powerCoefSelect, powerCoefCustom));
            bonusMalusSelect.addEventListener('change', () => toggleCustomInput(bonusMalusSelect, bonusMalusCustom));

            function getNumericValue(select, customInput) {
                if (select.value === 'custom') {
                    const val = customInput.value.trim();
                    if (val === '') return NaN;
                    const num = parseFloat(val);
                    return isNaN(num) || num < 0 ? NaN : num;
                }
                return parseFloat(select.value);
            }

            function calculate() {
                const base = getNumericValue(baseRateSelect, baseRateCustom);
                const territory = getNumericValue(territoryCoefSelect, territoryCoefCustom);
                const power = getNumericValue(powerCoefSelect, powerCoefCustom);
                const ageExpRaw = ageExperienceCoef.value.trim();
                const ageExp = ageExpRaw === '' ? NaN : parseFloat(ageExpRaw);
                const bonusMalus = getNumericValue(bonusMalusSelect, bonusMalusCustom);

                if (isNaN(base) || base < 0) {
                    showError('Введите корректную базовую ставку');
                    return;
                }
                if (isNaN(territory) || territory < 0) {
                    showError('Введите корректный коэффициент территории');
                    return;
                }
                if (isNaN(power) || power < 0) {
                    showError('Введите корректный коэффициент мощности');
                    return;
                }
                if (isNaN(ageExp) || ageExp < 0) {
                    showError('Введите корректный коэффициент возраст/стаж');
                    return;
                }
                if (isNaN(bonusMalus) || bonusMalus < 0) {
                    showError('Введите корректный коэффициент бонус-малус');
                    return;
                }

                hideError();

                const result = base * territory * power * ageExp * bonusMalus;
                const formattedResult = result % 1 === 0 ? result.toFixed(0) : result.toFixed(2);
                resultValue.textContent = Number(formattedResult).toLocaleString('ru-RU');
                resultCard.style.display = 'block';
            }

            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.add('show');
                resultCard.style.display = 'none';
            }

            function hideError() {
                errorMessage.classList.remove('show');
            }

            calculateBtn.addEventListener('click', calculate);

            // Инициализация
            toggleCustomInput(baseRateSelect, baseRateCustom);
            toggleCustomInput(territoryCoefSelect, territoryCoefCustom);
            toggleCustomInput(powerCoefSelect, powerCoefCustom);
            toggleCustomInput(bonusMalusSelect, bonusMalusCustom);
            calculate();
        })();
    </script>
</body>
</html>
