<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Калькулятор ин.учёта</title>
    <style>
        :root {
            --bg: #1c1c1e;
            --card-bg: #2c2c2e;
            --primary: #0a84ff;
            --primary-active: #0066d6;
            --text: #ffffff;
            --text-secondary: #98989d;
            --border: #3a3a3c;
            --input-bg: #3a3a3c;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-btn: 0 4px 12px rgba(10, 132, 255, 0.35);
            --result-bg: #3a3a3c;
            --static-bg: #3a3a3c;
            --radius: 16px;
            --font-large: 1.2rem;
            --font-medium: 1rem;
            --font-small: 0.9rem;
            --select-chevron: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%2398989d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            transition: background 0.2s ease;
        }

        .calculator {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 28px;
            padding: 28px 20px 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
            color: var(--text);
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: var(--font-small);
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: -0.2px;
            padding-left: 4px;
        }

        select,
        input {
            font-size: var(--font-large);
            padding: 14px 16px;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
            font-family: inherit;
            transition: border-color 0.15s;
            outline: none;
            letter-spacing: -0.2px;
        }

        select {
            background-image: var(--select-chevron);
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 18px;
            padding-right: 40px;
            cursor: pointer;
        }

        input {
            appearance: textfield;
            -webkit-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            opacity: 1;
            height: 32px;
        }

        .custom-input-wrapper {
            display: none;
            margin-top: 6px;
        }

        .custom-input-wrapper.active {
            display: block;
        }

        .custom-input-wrapper input {
            width: 100%;
        }

        .btn-calculate {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 18px 20px;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s;
            text-align: center;
            width: 100%;
            letter-spacing: -0.2px;
            box-shadow: var(--shadow-btn);
            margin-top: 8px;
        }

        .btn-calculate:active {
            background: var(--primary-active);
            transform: scale(0.98);
        }

        .result-card {
            background: var(--result-bg);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-top: 6px;
        }

        .result-label {
            font-size: var(--font-small);
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text);
            word-break: break-word;
        }

        .error-message {
            color: #ff453a;
            font-size: 0.85rem;
            margin-top: 2px;
            padding-left: 4px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        select:focus,
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.25);
        }

        /* Футер */
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 0 16px;
            width: 100%;
            max-width: 420px;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .footer a:hover {
            opacity: 0.8;
        }

        @media (max-width: 380px) {
            .calculator {
                padding: 20px 14px 18px;
                gap: 16px;
            }
            h1 {
                font-size: 1.6rem;
            }
            select,
            input {
                font-size: 1rem;
                padding: 12px 14px;
            }
            .btn-calculate {
                padding: 16px;
                font-size: 1.15rem;
            }
            .result-value {
                font-size: 2.2rem;
            }
            .footer {
                font-size: 0.8rem;
                margin-top: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>📋 Калькулятор</h1>

        <!-- Базовая ставка -->
        <div class="field-group">
            <label for="baseRateSelect">Базовая ставка</label>
            <select id="baseRateSelect">
                <option value="2500">2500</option>
                <option value="5500" selected>5500</option>
                <option value="6050">6050</option>
                <option value="8665">8665</option>
                <option value="custom">Другое…</option>
            </select>
            <div class="custom-input-wrapper" id="baseRateWrapper">
                <input type="number" id="baseRateCustom" placeholder="Введите значение" step="any" min="0">
            </div>
        </div>

        <!-- Коэффициент территории -->
        <div class="field-group">
            <label for="territoryCoefSelect">Коэффициент территории</label>
            <select id="territoryCoefSelect">
                <option value="1.7" selected>1.7</option>
                <option value="1">1</option>
                <option value="0.9">0.9</option>
                <option value="custom">Другое…</option>
            </select>
            <div class="custom-input-wrapper" id="territoryCoefWrapper">
                <input type="number" id="territoryCoefCustom" placeholder="Введите значение" step="any" min="0">
            </div>
        </div>

        <!-- Коэффициент мощности -->
        <div class="field-group">
            <label for="powerCoefSelect">Коэффициент мощности</label>
            <select id="powerCoefSelect">
                <option value="1.1">1.1</option>
                <option value="1.2">1.2</option>
                <option value="1.4">1.4</option>
                <option value="1.6" selected>1.6</option>
                <option value="custom">Другое…</option>
            </select>
            <div class="custom-input-wrapper" id="powerCoefWrapper">
                <input type="number" id="powerCoefCustom" placeholder="Введите значение" step="any" min="0">
            </div>
        </div>

        <!-- Коэффициент возраст/стаж -->
        <div class="field-group">
            <label for="ageExperienceCoef">Коэффициент возраст / стаж</label>
            <input type="number" id="ageExperienceCoef" value="1" step="any" min="0" placeholder="1">
        </div>

        <!-- Коэффициент бонус-малус -->
        <div class="field-group">
            <label for="bonusMalusSelect">Коэффициент бонус-малус (КБМ)</label>
            <select id="bonusMalusSelect">
                <option value="0.46">0.46</option>
                <option value="0.52">0.52</option>
                <option value="0.57">0.57</option>
                <option value="0.63">0.63</option>
                <option value="0.68">0.68</option>
                <option value="0.74">0.74</option>
                <option value="0.78">0.78</option>
                <option value="0.83">0.83</option>
                <option value="0.91">0.91</option>
                <option value="1">1</option>
                <option value="1.17" selected>1.17</option>
                <option value="1.76">1.76</option>
                <option value="2.25">2.25</option>
                <option value="2.94">2.94</option>
                <option value="3.92">3.92</option>
                <option value="custom">Другое…</option>
            </select>
            <div class="custom-input-wrapper" id="bonusMalusWrapper">
                <input type="number" id="bonusMalusCustom" placeholder="Введите значение" step="any" min="0">
            </div>
        </div>

        <!-- Коэффициент ограничения -->
        <div class="field-group">
            <label for="restrictionSelect">Коэффициент ограничения</label>
            <select id="restrictionSelect">
                <option value="1" selected>1 (Ограниченный)</option>
                <option value="3.16">3.16 (Неограниченный)</option>
                <option value="1.97">1.97 (Неограниченный Юр.лицо)</option>
            </select>
        </div>

        <button class="btn-calculate" id="calculateBtn">Рассчитать</button>

        <div id="errorMessage" class="error-message"></div>

        <div class="result-card" id="resultCard" style="display: none;">
            <div class="result-label">Итоговая стоимость</div>
            <div class="result-value" id="resultValue">0</div>
        </div>
    </div>

    <footer class="footer">
        По вопросам обращаться в <a href="https://t.me/hadykov" target="_blank" rel="noopener noreferrer">Telegram</a>
    </footer>

    <script>
        (function() {
            const baseRateSelect = document.getElementById('baseRateSelect');
            const baseRateWrapper = document.getElementById('baseRateWrapper');
            const baseRateCustom = document.getElementById('baseRateCustom');
            const territoryCoefSelect = document.getElementById('territoryCoefSelect');
            const territoryCoefWrapper = document.getElementById('territoryCoefWrapper');
            const territoryCoefCustom = document.getElementById('territoryCoefCustom');
            const powerCoefSelect = document.getElementById('powerCoefSelect');
            const powerCoefWrapper = document.getElementById('powerCoefWrapper');
            const powerCoefCustom = document.getElementById('powerCoefCustom');
            const ageExperienceCoef = document.getElementById('ageExperienceCoef');
            const bonusMalusSelect = document.getElementById('bonusMalusSelect');
            const bonusMalusWrapper = document.getElementById('bonusMalusWrapper');
            const bonusMalusCustom = document.getElementById('bonusMalusCustom');
            const restrictionSelect = document.getElementById('restrictionSelect');
            const calculateBtn = document.getElementById('calculateBtn');
            const errorMessage = document.getElementById('errorMessage');
            const resultCard = document.getElementById('resultCard');
            const resultValue = document.getElementById('resultValue');

            function toggleCustomInput(selectElement, wrapperElement, inputElement) {
                if (selectElement.value === 'custom') {
                    wrapperElement.classList.add('active');
                    inputElement.focus();
                } else {
                    wrapperElement.classList.remove('active');
                    inputElement.value = '';
                }
            }

            baseRateSelect.addEventListener('change', () => toggleCustomInput(baseRateSelect, baseRateWrapper, baseRateCustom));
            territoryCoefSelect.addEventListener('change', () => toggleCustomInput(territoryCoefSelect, territoryCoefWrapper, territoryCoefCustom));
            powerCoefSelect.addEventListener('change', () => toggleCustomInput(powerCoefSelect, powerCoefWrapper, powerCoefCustom));
            bonusMalusSelect.addEventListener('change', () => toggleCustomInput(bonusMalusSelect, bonusMalusWrapper, bonusMalusCustom));

            function getNumericValue(select, inputElement) {
                if (select.value === 'custom') {
                    const val = inputElement.value.trim();
                    if (val === '') return NaN;
                    const num = parseFloat(val);
                    return isNaN(num) || num < 0 ? NaN : num;
                }
                return parseFloat(select.value);
            }

            function calculate() {
                const base = getNumericValue(baseRateSelect, baseRateCustom);
                const territory = getNumericValue(territoryCoefSelect, territoryCoefCustom);
                const power = getNumericValue(powerCoefSelect, powerCoefCustom);
                const ageExpRaw = ageExperienceCoef.value.trim();
                const ageExp = ageExpRaw === '' ? NaN : parseFloat(ageExpRaw);
                const bonusMalus = getNumericValue(bonusMalusSelect, bonusMalusCustom);
                const restriction = parseFloat(restrictionSelect.value);

                if (isNaN(base) || base < 0) {
                    showError('Введите корректную базовую ставку');
                    return;
                }
                if (isNaN(territory) || territory < 0) {
                    showError('Введите корректный коэффициент территории');
                    return;
                }
                if (isNaN(power) || power < 0) {
                    showError('Введите корректный коэффициент мощности');
                    return;
                }
                if (isNaN(ageExp) || ageExp < 0) {
                    showError('Введите корректный коэффициент возраст/стаж');
                    return;
                }
                if (isNaN(bonusMalus) || bonusMalus < 0) {
                    showError('Введите корректный коэффициент бонус-малус');
                    return;
                }
                if (isNaN(restriction) || restriction <= 0) {
                    showError('Некорректный коэффициент ограничения');
                    return;
                }

                hideError();

                const result = base * territory * power * ageExp * bonusMalus * restriction;
                const formattedResult = result % 1 === 0 ? result.toFixed(0) : result.toFixed(2);
                resultValue.textContent = Number(formattedResult).toLocaleString('ru-RU');
                resultCard.style.display = 'block';
            }

            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.add('show');
                resultCard.style.display = 'none';
            }

            function hideError() {
                errorMessage.classList.remove('show');
            }

            calculateBtn.addEventListener('click', calculate);

            toggleCustomInput(baseRateSelect, baseRateWrapper, baseRateCustom);
            toggleCustomInput(territoryCoefSelect, territoryCoefWrapper, territoryCoefCustom);
            toggleCustomInput(powerCoefSelect, powerCoefWrapper, powerCoefCustom);
            toggleCustomInput(bonusMalusSelect, bonusMalusWrapper, bonusMalusCustom);

            calculate();
        })();
    </script>
</body>
</html>
